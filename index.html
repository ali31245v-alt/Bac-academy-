<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>رفيق الدراسة</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#111a2d;--line:#263650;--text:#edf3ff;--muted:#9aabc5;--mint:#7cf0c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#172b48,transparent 40%),var(--bg);color:var(--text);font:16px/1.7 Tahoma,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:22px 15px 45px}.brand{font-weight:bold;font-size:20px;margin-bottom:32px}.brand span{color:var(--mint)}header{text-align:center;margin-bottom:26px}h1{font-size:clamp(28px,5vw,43px);line-height:1.3;margin:8px 0}header p,.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin:15px 0}.drop{display:block;text-align:center;border:2px dashed #49617e;border-radius:15px;padding:25px;cursor:pointer;background:#0c1526}.drop b{display:block}.drop small{color:var(--muted)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#0c1526;color:var(--text);border:1px solid var(--line);padding:16px;border-radius:14px;text-align:right;font:inherit;cursor:pointer}.choice.active{border-color:var(--mint);background:#16342f}.choice strong{display:block}.choice small{display:block;color:var(--muted);margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:15px}.field label{display:block;margin-bottom:6px}.field select{width:100%;padding:12px;border-radius:10px;background:#0c1526;color:var(--text);border:1px solid var(--line)}.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--mint);color:#071a17;font-weight:bold;font-size:16px;cursor:pointer}.btn:disabled{opacity:.5}.note{font-size:12px;color:var(--muted);margin-top:12px}.status,.error,#results{display:none;margin-top:14px}.error{background:#351b28;color:#ffc2ca;padding:12px;border-radius:10px}.out{background:#0b1424;border:1px solid var(--line);border-radius:12px;padding:16px;overflow-wrap:anywhere}.flash{padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.flash .answer{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.bar{height:6px;background:#27354b;border-radius:8px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:var(--mint)}@media(max-width:580px){.choices,.row{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><main class="wrap"><div class="brand">✦ <span>رفيق الدراسة</span></div><header><div style="color:var(--mint)">من PDF إلى خطة مذاكرة</div><h1>افهم أسرع، واحفظ <span style="color:var(--mint)">أذكى.</span></h1><p>ارفع ملفك واختر بين ملخص شجري أو بطاقات مراجعة.</p></header>
<section class="card"><h3>١. ارفع ملف PDF</h3><label class="drop">📄<b>اضغط لاختيار ملف</b><small>يفضل أن يكون أقل من 40 MB<input id="pdf" type="file" accept=".pdf,application/pdf" style="display:block;margin:12px auto 0;max-width:100%"></small></label><p id="fname" class="muted"></p></section>
<section class="card"><h3>٢. اختر النتيجة</h3><div class="choices"><button class="choice active" data-mode="tree">🌳 <strong>ملخص شجري</strong><small>أفكار رئيسية وفروع وتعريفات وأسئلة فهم.</small></button><button class="choice" data-mode="cards">🧠 <strong>بطاقات متباعدة</strong><small>أسئلة وأجوبة ومواعيد مراجعة مقترحة.</small></button></div><div class="row"><div class="field"><label>التفصيل</label><select id="depth"><option value="concise">مركّز</option><option value="balanced" selected>متوازن</option><option value="detailed">مفصّل</option></select></div><div class="field"><label>اللغة</label><select id="lang"><option value="same">لغة الملف</option><option value="ar">العربية</option><option value="en">English</option></select></div></div><button id="go" class="btn" disabled>ابدأ التحليل الذكي ←</button><p class="note">يتطلب توليد النتائج إعداد خادم ذكاء اصطناعي على المسار /api/generate. لا تضع مفتاح API داخل هذا الملف.</p><div id="status" class="status"><p id="msg">جارٍ العمل…</p><div class="bar"><i id="bar"></i></div></div><div id="err" class="error"></div></section>
<section id="results" class="card"><h3 id="title">النتيجة</h3><div id="out" class="out"></div><button id="copy" class="btn">نسخ النتيجة</button><button id="save" class="btn" style="background:#24334c;color:white">حفظ TXT</button></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let file=null,mode='tree',result='';if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
$('pdf').onchange=()=>{file=$('pdf').files[0];$('fname').textContent=file?file.name:'';$('go').disabled=!file;$('err').style.display='none'};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===b))});
function error(t){$('err').textContent=t;$('err').style.display='block'}function safe(t){return String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('go').onclick=async()=>{if(!file)return;$('go').disabled=true;$('err').style.display='none';$('status').style.display='block';$('msg').textContent='جارٍ استخراج نص PDF…';$('bar').style.width='20%';try{if(!window.pdfjsLib)throw Error('تعذّر تحميل قارئ PDF. تحقق من الإنترنت.');let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,parts=[];for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),c=await p.getTextContent();parts.push('[الصفحة '+i+'] '+c.items.map(x=>x.str).join(' '));$('bar').style.width=(20+Math.round(30*i/pdf.numPages))+'%'}let text=parts.join('\n');if(text.replace(/\s/g,'').length<80)throw Error('الملف يبدو مصوراً أو لا يحتوي نصاً قابلاً للاستخراج؛ يلزم OCR.');$('msg').textContent='جارٍ تحليل المحتوى بالذكاء الاصطناعي…';$('bar').style.width='60%';let depth={concise:'مركّز',balanced:'متوازن',detailed:'مفصّل'}[$('depth').value],lang={same:'لغة المصدر',ar:'العربية',en:'الإنجليزية'}[$('lang').value];let prompt=mode==='tree'?'أنشئ ملخصاً شجرياً هرمياً دقيقاً من النص حصراً، مع محاور وفروع وتعريفات وأمثلة وأهم ما يجب تذكره وأسئلة فهم مع أجوبتها. لا تخترع معلومات. التفصيل: '+depth+'. اللغة: '+lang: 'أنشئ بطاقات مراجعة متباعدة دقيقة من النص حصراً، سؤال وجواب لكل بطاقة، مستوى easy/medium/hard، ومواعيد مراجعة [1,3,7,14]. أعد JSON صالحاً بالشكل {"cards":[{"question":"...","answer":"...","difficulty":"easy","review_days":[1,3,7,14]}]}. التفصيل: '+depth+'. اللغة: '+lang;let res;try{res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,filename:file.name,prompt,text,options:{depth:$('depth').value,language:$('lang').value}})})}catch(e){throw Error('محرك الذكاء الاصطناعي غير متصل. يجب تشغيل خادم خلفي على /api/generate وربطه بنموذج ذكاء اصطناعي.')}if(!res.ok)throw Error('فشل الخادم (HTTP '+res.status+'). تحقق من إعداد المحرك.');let data=await res.json();if(!data.result&&!data.cards)throw Error('استجابة المحرك غير مكتملة.');$('bar').style.width='100%';$('msg').textContent='اكتمل التحليل';$('results').style.display='block';$('title').textContent=mode==='tree'?'🌳 الملخص الشجري':'🧠 بطاقات المراجعة';if(mode==='cards'&&Array.isArray(data.cards)){result=JSON.stringify(data.cards,null,2);$('out').innerHTML=data.cards.map((c,i)=>'<article class="flash"><b>بطاقة '+(i+1)+': '+safe(c.question)+'</b><div class="answer">الإجابة: '+safe(c.answer)+'</div><small>المراجعة بعد: '+safe((c.review_days||[1,3,7,14]).join('، '))+' يوم</small></article>').join('')}else{result=String(data.result||'');$('out').innerHTML=result.split('\n').map(line=>'<p>'+safe(line)+'</p>').join('')}$('results').scrollIntoView({behavior:'smooth'})}catch(e){error(e.message);$('status').style.display='none'}finally{$('go').disabled=!file}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(result);$('copy').textContent='تم النسخ ✓'}catch(e){error('انسخ النص يدوياً من النتيجة.')}};$('save').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([result],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='study-result.txt';a.click();URL.revokeObjectURL(u)};
})();
</script></body></html>
